<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Yahtzee</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#fffdf7">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-900 h-[100dvh] w-full flex justify-center overflow-hidden">

    <div id="app" class="w-full max-w-md h-full flex flex-col bg-white shadow-xl relative">

        <div id="setup-screen" class="table-surface flex-1 flex flex-col p-5 overflow-y-auto">
            <div class="title-card rounded-lg px-5 py-6 mt-1 mb-5">
                <div class="flex items-start justify-between gap-4">
                    <div class="min-w-0">
                        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.28em]">Classic Dice</p>
                        <h1 class="title-mark text-5xl font-black tracking-wide uppercase leading-none mt-2">Yahtzee</h1>
                        <p class="mt-3 text-sm leading-5 text-slate-600">Classic scoring with a clean table presence.</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 shrink-0 pt-1" aria-hidden="true">
                        <div class="title-die w-11 h-11 rounded-lg rotate-[-8deg] flex items-center justify-center">
                            <div class="grid grid-cols-3 grid-rows-3 gap-0.5 w-full h-full p-1.5 place-items-center">
                                <div class="die-dot col-start-1 row-start-1"></div>
                                <div class="die-dot col-start-3 row-start-1"></div>
                                <div class="die-dot col-start-2 row-start-2"></div>
                                <div class="die-dot col-start-1 row-start-3"></div>
                                <div class="die-dot col-start-3 row-start-3"></div>
                            </div>
                        </div>
                        <div class="title-die w-11 h-11 rounded-lg rotate-[7deg] flex items-center justify-center mt-3">
                            <div class="grid grid-cols-3 grid-rows-3 gap-0.5 w-full h-full p-1.5 place-items-center">
                                <div class="die-dot col-start-1 row-start-1"></div>
                                <div class="die-dot col-start-3 row-start-1"></div>
                                <div class="die-dot col-start-1 row-start-2"></div>
                                <div class="die-dot col-start-3 row-start-2"></div>
                                <div class="die-dot col-start-1 row-start-3"></div>
                                <div class="die-dot col-start-3 row-start-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-panel rounded-lg p-4 space-y-5">
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Preset</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyPreset('local')" class="secondary-action py-3 rounded-lg border border-slate-300 bg-white text-sm font-semibold active:scale-95">Pass and Play</button>
                        <button onclick="applyPreset('ai')" class="secondary-action py-3 rounded-lg border border-slate-300 bg-white text-sm font-semibold active:scale-95">Vs AI</button>
                    </div>
                </div>

                <div>
                    <label for="player-count" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Players</label>
                    <select id="player-count" onchange="setPlayerCount(this.value)" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-base font-medium">
                        <option value="1" selected>1 player</option>
                        <option value="2">2 players</option>
                        <option value="3">3 players</option>
                        <option value="4">4 players</option>
                    </select>
                </div>

                <label for="dark-mode-toggle" class="secondary-action flex items-center justify-between gap-3 rounded-lg border border-slate-300 bg-white px-3 py-3">
                    <span class="text-sm font-semibold">Dark Mode</span>
                    <input id="dark-mode-toggle" type="checkbox" onchange="setDarkMode(this.checked)" class="h-5 w-5 accent-slate-950">
                </label>

                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Seats</div>
                    <div id="player-config" class="space-y-2"></div>
                </div>
            </div>

            <div class="mt-auto pt-6 space-y-3">
                <button id="continue-btn" onclick="loadSavedGame()" class="hidden w-full py-3 rounded-lg border border-blue-300 bg-blue-50 text-blue-800 font-semibold active:scale-95">Continue Saved Game</button>
                <button onclick="startGame()" class="primary-action w-full py-4 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md">Start Game</button>
            </div>
        </div>

        <div id="game-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <header class="p-3 border-b border-slate-200 bg-white z-10 shrink-0">
                <div class="flex justify-between items-start gap-3">
                    <div>
                        <h2 id="player-turn" class="text-base font-semibold leading-tight">Player 1</h2>
                        <p id="round-info" class="text-[11px] text-slate-500 uppercase tracking-wide leading-tight">Round 1 / 13</p>
                        <p id="turn-status" class="text-[11px] text-blue-700 font-semibold mt-0.5 min-h-3 leading-tight"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wide leading-tight">Total Score</p>
                        <p id="current-score" class="text-xl font-light leading-tight">0</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button id="undo-btn" onclick="undoScore()" class="py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold disabled:opacity-40 active:scale-95">Undo Score</button>
                    <button onclick="confirmNewGame()" class="py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold active:scale-95">New Game</button>
                </div>
            </header>

            <main class="flex-1 overflow-hidden p-2">
                <div class="grid grid-cols-2 gap-2 h-full content-start">
                    <div class="min-w-0">
                        <h3 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1 leading-tight">Upper</h3>
                        <div id="upper-scores" class="space-y-1"></div>
                        <div class="mt-1 p-1.5 bg-slate-100 rounded-lg flex justify-between text-xs border border-slate-200">
                            <span class="text-slate-600">Bonus at 63</span>
                            <span id="upper-bonus" class="font-medium">0/63</span>
                        </div>
                    </div>
                    <div class="min-w-0">
                        <h3 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1 leading-tight">Lower</h3>
                        <div id="lower-scores" class="space-y-1"></div>
                    </div>
                </div>
            </main>

            <footer class="dice-tray w-full bg-white border-t border-slate-200 p-2 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] shrink-0 z-20">
                <div id="dice-container" class="flex justify-between mb-2 px-1"></div>
                <button id="roll-btn" onclick="rollDice()" class="primary-action w-full py-3 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md flex items-center justify-center disabled:opacity-50 disabled:active:scale-100">
                    <span id="roll-text">Roll Dice</span>
                    <span id="rolls-left" class="bg-slate-700 text-xs px-2 py-1 rounded-md ml-2">3 Left</span>
                </button>
            </footer>
        </div>

        <div id="game-over-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6 bg-white z-30 absolute inset-0">
            <h1 class="text-3xl font-light mb-8 uppercase tracking-widest">Game Over</h1>
            <div id="final-standings" class="w-full space-y-3 mb-8"></div>
            <button onclick="resetGame()" class="w-full py-4 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md">
                Play Again
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
